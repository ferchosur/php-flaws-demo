# Namespace limits: prevent a compromised pod from consuming the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-quota
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
spec:
  hard:
    # Headroom for rolling update with replicas=5 (5 active + surge).
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "5"
    limits.memory: 3Gi
    services.loadbalancers: "1"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-limits
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
