apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-php-test-site
  labels:
    app.kubernetes.io/part-of: php-flaws-demo-labs
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress: []
