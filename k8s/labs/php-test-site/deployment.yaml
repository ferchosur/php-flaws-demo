apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-test-site
  labels:
    app.kubernetes.io/name: php-test-site
    app.kubernetes.io/part-of: php-flaws-demo-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: php-test-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: php-test-site
        app.kubernetes.io/part-of: php-flaws-demo-labs
        lab.php-flaws-demo/environment: php-test-site
        lab.php-flaws-demo/php-version: "8.3.26"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: php-flaws-demo/php-test-site:8.3.26
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: apache-run
              mountPath: /var/run/apache2
            - name: apache-lock
              mountPath: /var/lock/apache2
            - name: apache-log
              mountPath: /var/log/apache2
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: apache-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: apache-lock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: apache-log
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
