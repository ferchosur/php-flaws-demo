apiVersion: v1
kind: Service
metadata:
  name: php2shell-php-apache-target
  namespace: lab-php2shell
  labels:
    app.kubernetes.io/name: php-apache-target
    app.kubernetes.io/part-of: php-flaws-demo-labs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: php-apache-target
    lab.php-flaws-demo/php-version: "8.4.26"
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
