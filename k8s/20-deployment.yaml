apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-flaws-demo
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
    expires_at: __EXPIRES_AT__
spec:
  replicas: __REPLICAS__
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: php-flaws-demo
  template:
    metadata:
      labels:
        created_by: __OWNER__
        app: php-flaws-demo
    spec:
      serviceAccountName: php-flaws-demo
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
