# Single public entry point: HTTP on 80 reaching the container on 8080.
apiVersion: v1
kind: Service
metadata:
  name: php-flaws-demo
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
spec:
  type: LoadBalancer
  selector:
    app: php-flaws-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
