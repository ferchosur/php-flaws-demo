# Mercado Norte: configuración endurecida de nginx.
# Sin PHP ni FastCGI, sin listados de directorio, solo GET/HEAD y cabeceras de seguridad.
# Todas las rutas temporales apuntan a /tmp, la única escritura permitida (sistema de archivos de solo lectura).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    map $request_method $method_allowed {
        GET     1;
        HEAD    1;
        default 0;
    }

    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        if ($method_allowed = 0) {
            return 405;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Nada que parezca script, configuración o control de versiones se sirve jamás.
        location ~* \.(php|phtml|phar|pl|cgi|sh|env|bak|sql|git)$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }

        location /assets/ {
            expires 1h;
            try_files $uri =404;
        }

        location / {
            limit_req zone=perip burst=20 nodelay;
            try_files $uri $uri/ =404;
        }
    }
}
