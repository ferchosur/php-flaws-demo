# Hardened profile (local equivalent of k8s/20-deployment.yaml, 1 replica).
# Note: kindnet (kind's default CNI) does NOT enforce NetworkPolicy; the cloud
# egress-deny is not reproduced here. The rest of the hardening (non-root,
# cap-drop, read-only fs, seccomp, no SA token) does apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-flaws-demo
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-flaws-demo
  template:
    metadata:
      labels:
        created_by: __OWNER__
        app: php-flaws-demo
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
