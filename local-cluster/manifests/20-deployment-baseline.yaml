# "Careless prod" profile: no hardening. To contrast with the hardened profile
# (20-deployment-hardened.yaml). Do NOT use in the cloud or outside the lab.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-flaws-demo
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-flaws-demo
  template:
    metadata:
      labels:
        created_by: __OWNER__
        app: php-flaws-demo
    spec:
      # Careless prod: mounts the default ServiceAccount token.
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            # No hardening: root, escalation allowed, writable fs, seccomp Unconfined.
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            seccompProfile:
              type: Unconfined
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
# No NetworkPolicy: internal ingress and egress open (like an unsegmented prod).
