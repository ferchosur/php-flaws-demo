# NodePort fijo 30080 (mapeado por kind a localhost:8080). kind no trae
# LoadBalancer, así que no se usa type: LoadBalancer como en la nube.
apiVersion: v1
kind: Service
metadata:
  name: php-flaws-demo
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
spec:
  type: NodePort
  selector:
    app: php-flaws-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
