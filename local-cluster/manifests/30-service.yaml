# Fixed NodePort 30080 (mapped by kind to localhost:8080). kind has no
# LoadBalancer, so type: LoadBalancer is not used as in the cloud.
apiVersion: v1
kind: Service
metadata:
  name: php-flaws-demo
  namespace: php-flaws-demo
  labels:
    created_by: __OWNER__
    app: php-flaws-demo
spec:
  type: NodePort
  selector:
    app: php-flaws-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
