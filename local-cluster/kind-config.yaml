# Clúster kind de un solo nodo. Mapea el NodePort 30080 del nodo al puerto 8080
# del equipo, para que la app quede en http://localhost:8080 sin port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
